name: Try to Create OCI VM (Singapore)

# Runs every 10 minutes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  OCI_CLI_REGION: "ap-singapore-1"
  # AD / subnet / image IDs are looked up automatically via the OCI API
  # (same logic as the laptop retry script) - no secrets needed for them.
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache OCI CLI
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI
        run: |
          pip install oci-cli
          mkdir -p /home/runner/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/oci_api_key.pem
          cat > /home/runner/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          region=ap-singapore-1
          EOF
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

      - name: Lookup AD, subnet and images
        id: lookup
        run: |
          AD_NAME=$(oci iam availability-domain list \
            --compartment-id "$COMPARTMENT_ID" \
            --query 'data[0].name' --raw-output 2>/dev/null)
          echo "AD: $AD_NAME"

          VCN_ID=$(oci network vcn list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "zinminthu-vcn" \
            --query 'data[0].id' --raw-output 2>/dev/null)
          echo "VCN: $VCN_ID"

          SUBNET_ID=$(oci network subnet list \
            --compartment-id "$COMPARTMENT_ID" \
            --vcn-id "$VCN_ID" 2>/dev/null | python3 -c "
          import json, sys
          subs = json.load(sys.stdin)['data']
          pub = [s for s in subs if 'public' in s.get('display-name', '').lower()]
          pick = (pub or subs)[0] if subs else None
          print(pick['id'] if pick else '')
          ")
          echo "Subnet: $SUBNET_ID"

          IMAGE_ARM=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC --limit 5 \
            --query 'data[0].id' --raw-output 2>/dev/null)
          echo "Image ARM: $IMAGE_ARM"

          IMAGE_AMD=$(oci compute image list \
            --compartment-id "$COMPARTMENT_ID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.E2.1.Micro" \
            --sort-by TIMECREATED --sort-order DESC --limit 5 \
            --query 'data[0].id' --raw-output 2>/dev/null)
          echo "Image AMD: $IMAGE_AMD"

          for v in "$AD_NAME" "$VCN_ID" "$SUBNET_ID" "$IMAGE_ARM" "$IMAGE_AMD"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "❌ Lookup failed — one of AD/VCN/subnet/image came back empty."
              exit 1
            fi
          done

          echo "ad_name=$AD_NAME" >> $GITHUB_OUTPUT
          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "image_arm=$IMAGE_ARM" >> $GITHUB_OUTPUT
          echo "image_amd=$IMAGE_AMD" >> $GITHUB_OUTPUT

      - name: Check if Ampere VM already exists
        id: check_ampere
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --lifecycle-state RUNNING \
            --query "data[?contains(\"display-name\", 'oci-ampere') || shape=='VM.Standard.A1.Flex'].id" \
            --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "[]" ] && [ "$EXISTING" != "" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Ampere VM already exists, skipping creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing Ampere VM found, will attempt creation."
          fi

      - name: Try Ampere A1.Flex (2 OCPU / 12 GB)
        id: create_ampere
        if: steps.check_ampere.outputs.exists == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "${{ steps.lookup.outputs.ad_name }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "${{ steps.lookup.outputs.subnet_id }}" \
            --image-id "${{ steps.lookup.outputs.image_arm }}" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "oci-ampere-2-12" \
            --boot-volume-size-in-gbs 50 2>&1 || true)
          echo "----- OCI raw output -----"
          echo "$OCI_OUTPUT"
          echo "--------------------------"
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "result=created" >> $GITHUB_OUTPUT
            echo "✅ VICTORY! Ampere VM is being created."
          elif echo "$OCI_OUTPUT" | grep -q 'Out of capacity'; then
            echo "result=capacity" >> $GITHUB_OUTPUT
            echo "⚠️ Out of host capacity (expected)."
          elif echo "$OCI_OUTPUT" | grep -qi 'too many requests'; then
            echo "result=ratelimit" >> $GITHUB_OUTPUT
            echo "⏳ Rate limited — will retry on next schedule."
          else
            echo "result=error" >> $GITHUB_OUTPUT
            echo "❌ Unexpected error."
          fi

      - name: Check if AMD Micro already exists
        id: check_amd
        if: steps.create_ampere.outputs.result == 'capacity' || steps.create_ampere.outputs.result == 'ratelimit' || steps.check_ampere.outputs.exists == 'true'
        run: |
          EXISTING=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --lifecycle-state RUNNING \
            --query "data[?shape=='VM.Standard.E2.1.Micro'].id" \
            --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "[]" ] && [ "$EXISTING" != "" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Try AMD E2.1.Micro (backup)
        id: create_amd
        if: steps.check_amd.outputs.exists == 'false' && (steps.create_ampere.outputs.result == 'capacity' || steps.create_ampere.outputs.result == 'ratelimit' || steps.check_ampere.outputs.exists == 'true')
        continue-on-error: true
        run: |
          set -o pipefail
          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "${{ steps.lookup.outputs.ad_name }}" \
            --shape "VM.Standard.E2.1.Micro" \
            --subnet-id "${{ steps.lookup.outputs.subnet_id }}" \
            --image-id "${{ steps.lookup.outputs.image_amd }}" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "oci-amd-micro" \
            --boot-volume-size-in-gbs 50 2>&1 || true)
          echo "----- OCI raw output (AMD) -----"
          echo "$OCI_OUTPUT"
          echo "--------------------------------"
          echo "amd_log<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "amd_result=created" >> $GITHUB_OUTPUT
          elif echo "$OCI_OUTPUT" | grep -q 'Out of capacity'; then
            echo "amd_result=capacity" >> $GITHUB_OUTPUT
          elif echo "$OCI_OUTPUT" | grep -qi 'too many requests'; then
            echo "amd_result=ratelimit" >> $GITHUB_OUTPUT
          else
            echo "amd_result=error" >> $GITHUB_OUTPUT
          fi

      - name: Telegram notify - Ampere created
        if: steps.create_ampere.outputs.result == 'created'
        run: |
          MSG="🚀 *OCI Ampere VM CREATED!*%0A%0A2 OCPU / 12 GB in Singapore.%0A%0ACheck OCI Console → Compute → Instances.%0A%0A⚠️ Laptop script ကို ရပ်လိုက်ပါ!"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown" > /dev/null

      - name: Telegram notify - AMD created
        if: steps.create_amd.outputs.amd_result == 'created'
        run: |
          MSG="✅ *OCI AMD Micro CREATED* (backup)%0A%0AAmpere ကို ဆက်ရှာနေပါတယ်."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" \
            -d "parse_mode=Markdown" > /dev/null

      - name: Telegram notify - already exists
        if: steps.check_ampere.outputs.exists == 'true'
        run: |
          MSG="ℹ️ Ampere VM already running — skipped creation."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG" > /dev/null
